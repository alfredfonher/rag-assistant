[project]
name = "rag-llama-server"
version = "0.1.0"
description = "Lightweight llama.cpp server for rag-assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "llama-cpp-python>=0.2.90",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
rag-llama-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
