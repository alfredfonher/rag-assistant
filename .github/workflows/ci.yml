name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tests
        run: go test ./...
        working-directory: service

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Bootstrap Python environment
        run: uv sync --python 3.12 --project llama-server --extra dev --locked
      - name: Run Python tests
        run: llama-server/.venv/bin/python -m pytest -q llama-server/

  shell-tests:
    name: Shell lifecycle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run runtime lifecycle tests
        run: bash scripts/tests/runtime.sh
