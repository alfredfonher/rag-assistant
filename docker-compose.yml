services:
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8090:8090"
    volumes:
      - ./models:/models:ro
    environment:
      - RAG_EMBEDDING_MODEL=/models/nomic-embed-text-v1.5.f32.gguf
      - RAG_LLM_MODEL=/models/gemma-3-1b-it-Q4_K_M.gguf
      - RAG_LLAMA_HOST=0.0.0.0
      - RAG_LLAMA_PORT=8090
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - RAG_HTTP_ADDR=:8080
      - RAG_LLAMA_SERVER_URL=http://llama-server:8090
      - RAG_DATA_DIR=/data
    volumes:
      - rag-data:/data
    depends_on:
      llama-server:
        condition: service_healthy

volumes:
  rag-data:
