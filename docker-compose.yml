services:
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8090:8090"
    volumes:
      - ./models:/models:ro
    environment:
      - RAG_EMBEDDING_MODEL=/models/nomic-embed-text-v1.5.f32.gguf
      - RAG_LLM_MODEL=/models/Qwen3.5-0.8B.Q5_K_M.gguf
      - RAG_LLAMA_HOST=0.0.0.0
      - RAG_LLAMA_PORT=8090
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - RAG_HTTP_ADDR=:8080
      - RAG_LLAMA_SERVER_URL=http://llama-server:8090
      - RAG_DATA_DIR=/data
      - RAG_INGEST_ROOT=/docs
    volumes:
      - rag-data:/data
      - ./docs:/docs:ro
    depends_on:
      llama-server:
        condition: service_healthy

volumes:
  rag-data:
